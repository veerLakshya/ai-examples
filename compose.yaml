services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai-pgdata:/var/lib/postgresql/data

volumes:
  ai-pgdata: